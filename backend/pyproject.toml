[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sequence-platform-backend"
version = "0.1.0"
description = "Sequence Platform - backend API, database clients, and sequence analysis"
readme = "README.md"
requires-python = ">=3.12"
# Runtime dependencies are deliberately minimal. They stay installed in
# Stage 1 because the approved architecture's layering (FastAPI app,
# Biopython-based analysis, httpx-based ENA client, env-driven config)
# depends on them from day one. No database server and no auth.
dependencies = [
    "biopython>=1.85",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10",
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test suite drives the ASGI app with async clients; run coroutine
# tests automatically instead of requiring explicit marks.
asyncio_mode = "auto"

[tool.ruff]
# Stage 1: standard/default rule set, default 88-character line length.
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = [
    "E501",  # line length is handled by `ruff format`
]

[tool.mypy]
# Stage 1: gradual/moderate typing. No strict mode, and no follow-imports
# errors from untyped third-party packages (e.g. Biopython). This becomes
# stricter as the project matures.
python_version = "3.12"
mypy_path = "src"
files = ["src", "tests"]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
follow_untyped_imports = true
